version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: agricarbon_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hoa0976271476
      MYSQL_DATABASE: overrun
      MYSQL_USER: agricarbon
      MYSQL_PASSWORD: agricarbon123
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "3307:3306"  # Different port for dev
    networks:
      - agricarbon_dev_network

  # Backend API (Development)
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile.dev
    container_name: agricarbon_backend_dev
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://root:hoa0976271476@database/overrun
      - SECRET_KEY=dev-secret-key-not-for-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - GEMINI_API_KEY=AIzaSyDT0bh977dN__89Z45neWY0oldJf_swStc
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8001:8000"  # Different port for dev
    depends_on:
      - database
    networks:
      - agricarbon_dev_network
    volumes:
      - ./BE:/app  # Mount source code for hot reload
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Frontend (Development)
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile.dev
    container_name: agricarbon_frontend_dev
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api
    ports:
      - "5173:5173"  # Vite dev server port
    depends_on:
      - backend
    networks:
      - agricarbon_dev_network
    volumes:
      - ./FE:/app  # Mount source code for hot reload
      - /app/node_modules  # Anonymous volume for node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  mysql_dev_data:
    driver: local

networks:
  agricarbon_dev_network:
    driver: bridge 